apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: stackshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/user-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: POSTGRES_PASSWORD
            - name: PORT
              value: "8001"
            - name: DB_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/users?sslmode=disable"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: stackshop
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
