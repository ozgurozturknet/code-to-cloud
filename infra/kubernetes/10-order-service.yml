apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stackshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/order-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: POSTGRES_PASSWORD
            - name: PORT
              value: "8003"
            - name: DB_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/orders"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: KAFKA_BROKERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stackshop-secrets
                  key: JWT_SECRET
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: PRODUCT_SERVICE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: stackshop
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003
