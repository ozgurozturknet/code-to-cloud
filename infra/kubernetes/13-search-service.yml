apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: stackshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/search-service:latest
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: ELASTICSEARCH_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: KAFKA_BROKERS
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: stackshop
spec:
  selector:
    app: search-service
  ports:
    - port: 8005
      targetPort: 8005
