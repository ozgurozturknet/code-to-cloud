apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: stackshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/YOUR_GITHUB_USERNAME/notification-service:latest
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: stackshop-config
                  key: KAFKA_BROKERS
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
